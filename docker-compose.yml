services:
  mydb:
    image: mysql:8
    container_name: mydb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mydb-data:/var/lib/mysql
  webman:
    build: .
    container_name: my-webman
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_PORT: ${DB_PORT}
    ports:
      - "8888:8787"
    depends_on:
      - mydb
  frontend:
    build: ./frontend
    container_name: my-frontend
    ports:
      - "5173:5173"
    depends_on:
      - webman
  nginx:
    image: nginx:alpine
    container_name: my-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webman
      - frontend
volumes:
  mydb-data: