                <div class="field">
                    <label>Judul Proyek</label>
                    <input type="text" name="title"
                           value="<?=isset($portfolio) && $portfolio ? htmlspecialchars($portfolio->title ?? '') : ''?>"

                    <label>Kategori</label>
                    <input type="text" name="category"
                           value="<?=isset($portfolio) && $portfolio ? htmlspecialchars($portfolio->category ?? '') : ''?>"
                           placeholder="Misal: Web, Mobile, AI">
                </div>

                <div class="field">
                    <label>Deskripsi</label>
                    <textarea name="description" placeholder="Deskripsi proyek…"><?=isset($portfolio) && $portfolio ? htmlspecialchars($portfolio->description ?? '') : ''?></textarea>
                </div>

                <div class="field">
                    <label>URL Proyek <span style="text-transform:none;letter-spacing:0;font-weight:400">(opsional)</span></label>

                </div>

                    <label>Gambar <span style="text-transform:none;letter-spacing:0;font-weight:400">(opsional · jpg, png, gif, webp · maks 2MB)</span></label>

                    <?php if ($currentImage): ?>
                        <div class="img-preview">

                            </label>
                        </div>
                    <?php endif; ?>

                    <input type="file" name="image" accept="image/*" id="imageInput">
                    <div id="newPreview" class="img-preview" style="display:none">
                        <img src="" alt="Pratinjau">
                    </div>

</main>

<script src="/app.js"></script>
<script>
    (function () {
        var input = document.getElementById('imageInput');
        var box = document.getElementById('newPreview');
        if (!input || !box) return;
        var img = box.querySelector('img');
        input.addEventListener('change', function () {
            var file = this.files && this.files[0];
            if (!file) { box.style.display = 'none'; return; }
            img.src = URL.createObjectURL(file);
            box.style.display = 'block';
        });
    })();
</script>
</body>
