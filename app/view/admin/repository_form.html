<main class="admin-shell">

        <div class="admin-head">

                <p class="eyebrow"><a href="/admin/repository" class="muted">&larr; Kembali ke daftar</a></p>

        <div class="panel">
            <form method="post" action="<?=isset($repository) && isset($repository->id) ? '/admin/repository/update/'.$repository->id : '/admin/repository/store'?>">

                <div class="field">
                    <label>Nama Repository</label>
                    <input type="text" name="name"
                           value="<?=isset($repository) && $repository ? htmlspecialchars($repository->name ?? '') : ''?>"
                           placeholder="Nama repository">
                    <?php if (!empty($errors['name'])): ?><div class="error"><?=htmlspecialchars($errors['name'])?></div><?php endif; ?>
                </div>

                <div class="field">
                    <label>Deskripsi</label>
                    <textarea name="description" placeholder="Deskripsi repository…"><?=isset($repository) && $repository ? htmlspecialchars($repository->description ?? '') : ''?></textarea>
                </div>

                <div class="field">
                    <label>Bahasa</label>
                    <input type="text" name="language"
                           value="<?=isset($repository) && $repository ? htmlspecialchars($repository->language ?? '') : ''?>"
                           placeholder="Misal: PHP, Python, Dart">
                </div>

                <div class="field">
                    <label>URL GitHub</label>
                    <input type="url" name="github_url"
                           value="<?=isset($repository) && $repository ? htmlspecialchars($repository->github_url ?? '') : ''?>"
                           placeholder="https://github.com/Mhafiznugrahaa/nama-repo">
                </div>

                <div class="field">
                    <label>Jumlah Stars</label>
                    <input type="number" name="stars" min="0"
                           value="<?=isset($repository) && $repository ? htmlspecialchars($repository->stars ?? '0') : '0'?>">
                </div>

                <div class="field">
                    <label>Status</label>
                    <select name="status">
                        <option value="published" <?=isset($repository) && ($repository->status ?? 'published') === 'published' ? 'selected' : ''?>>Published (tampil di publik)</option>
                        <option value="draft" <?=isset($repository) && ($repository->status ?? '') === 'draft' ? 'selected' : ''?>>Draft (disembunyikan)</option>
                    </select>
                </div>

                <div style="display:flex;gap:12px;margin-top:8px">
                    <button class="btn" type="submit">Simpan</button>
                    <a href="/admin/repository" class="btn ghost">Batal</a>
